<main class="app-shell">
  <header class="app-header">
    <a routerLink="/restaurants" class="brand-link" aria-label="Home">
      <p class="eyebrow">Food delivery</p>
      <h1>Fresh meals</h1>
    </a>
    @if (auth.isAuthenticated()) {
      <div class="account-actions">
        <span class="user-badge">{{ auth.user()?.firstName }}</span>
        @if (!isAdminRoute()) {
          <a routerLink="/restaurants"><button class="secondary" type="button">Browse</button></a>
          <a routerLink="/restaurants/my-orders"><button class="secondary" type="button">My Orders</button></a>
        }
        @if (auth.isAdmin()) {
          <nav class="mode-switch" aria-label="Workflow">
            <a routerLink="/restaurants"><button type="button" [class.active]="!isAdminRoute()">Shop</button></a>
            <a routerLink="/admin"><button type="button" [class.active]="isAdminRoute()">Admin</button></a>
          </nav>
        }
        <button class="secondary" type="button" (click)="logout()">Sign out</button>
      </div>
    }
  </header>

  <div class="app-content">
    @if (notifications.notice()) {
      <p class="notice">{{ notifications.notice() }}</p>
    }

    @if (notifications.error()) {
      <p class="error">{{ notifications.error() }}</p>
    }

    <router-outlet />
  </div>
</main>
