services:
  user-service-mysql:
    image: mysql:8.4
    container_name: user-service-mysql
    environment:
      MYSQL_DATABASE: user_service_db
      MYSQL_USER: user_service
      MYSQL_PASSWORD: user_service_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3307:3306"
    volumes:
      - user_service_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_password"]
      interval: 10s
      timeout: 5s
      retries: 10

  restaurant-service-mysql:
    image: mysql:8.4
    container_name: restaurant-service-mysql
    environment:
      MYSQL_DATABASE: restaurant_service_db
      MYSQL_USER: restaurant_service
      MYSQL_PASSWORD: restaurant_service_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3308:3306"
    volumes:
      - restaurant_service_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_password"]
      interval: 10s
      timeout: 5s
      retries: 10

  food-catalogue-service-mysql:
    image: mysql:8.4
    container_name: food-catalogue-service-mysql
    environment:
      MYSQL_DATABASE: food_catalogue_service_db
      MYSQL_USER: food_catalogue_service
      MYSQL_PASSWORD: food_catalogue_service_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3309:3306"
    volumes:
      - food_catalogue_service_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_password"]
      interval: 10s
      timeout: 5s
      retries: 10

  order-service-mongodb:
    image: mongo:7
    container_name: order-service-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: order_service
      MONGO_INITDB_ROOT_PASSWORD: order_service_password
      MONGO_INITDB_DATABASE: order_service_db
    ports:
      - "27017:27017"
    volumes:
      - order_service_mongodb_data:/data/db

volumes:
  user_service_mysql_data:
  restaurant_service_mysql_data:
  food_catalogue_service_mysql_data:
  order_service_mongodb_data:
