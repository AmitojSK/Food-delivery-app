services:

  kafka:
    image: bitnami/kafka:3.9
    container_name: kafka
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_KRAFT_CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "/opt/bitnami/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 5s
      retries: 12

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    profiles: ["dev-tools"]
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "8090:8080"

  redis:
    image: redis:7.4-alpine
    container_name: redis
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-redis_local_password}"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a $${REDIS_PASSWORD:-redis_local_password} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------- databases ----------

  user-service-mysql:
    image: mysql:8.4
    container_name: user-service-mysql
    environment:
      MYSQL_DATABASE: user_service_db
      MYSQL_USER: user_service
      MYSQL_PASSWORD: user_service_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3307:3306"
    volumes:
      - user_service_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_password"]
      interval: 10s
      timeout: 5s
      retries: 10

  restaurant-service-mysql:
    image: mysql:8.4
    container_name: restaurant-service-mysql
    environment:
      MYSQL_DATABASE: restaurant_service_db
      MYSQL_USER: restaurant_service
      MYSQL_PASSWORD: restaurant_service_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3308:3306"
    volumes:
      - restaurant_service_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_password"]
      interval: 10s
      timeout: 5s
      retries: 10

  food-catalogue-service-mysql:
    image: mysql:8.4
    container_name: food-catalogue-service-mysql
    environment:
      MYSQL_DATABASE: food_catalogue_service_db
      MYSQL_USER: food_catalogue_service
      MYSQL_PASSWORD: food_catalogue_service_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3309:3306"
    volumes:
      - food_catalogue_service_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_password"]
      interval: 10s
      timeout: 5s
      retries: 10

  order-service-mongodb:
    image: mongo:7
    container_name: order-service-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: order_service
      MONGO_INITDB_ROOT_PASSWORD: order_service_password
      MONGO_INITDB_DATABASE: order_service_db
    ports:
      - "27017:27017"
    volumes:
      - order_service_mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10

  delivery-service-mysql:
    image: mysql:8.4
    container_name: delivery-service-mysql
    environment:
      MYSQL_DATABASE: delivery_service_db
      MYSQL_USER: delivery_service
      MYSQL_PASSWORD: delivery_service_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3310:3306"
    volumes:
      - delivery_service_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_password"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------- backend services ----------

  discovery-server:
    build: services/discovery-server
    container_name: discovery-server
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8761/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  user-service:
    build: services/user-service
    container_name: user-service
    depends_on:
      user-service-mysql:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      USER_SERVICE_DB_URL: jdbc:mysql://user-service-mysql:3306/user_service_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      USER_SERVICE_DB_USERNAME: user_service
      USER_SERVICE_DB_PASSWORD: user_service_password
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://discovery-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:-c3ByaW5nLWJvb3QtdXNlci1zZXJ2aWNlLWxvY2FsLWRldmVsb3BtZW50LXNlY3JldC0yMDI2}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  restaurant-service:
    build: services/restaurant-service
    container_name: restaurant-service
    depends_on:
      restaurant-service-mysql:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      RESTAURANT_SERVICE_DB_URL: jdbc:mysql://restaurant-service-mysql:3306/restaurant_service_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      RESTAURANT_SERVICE_DB_USERNAME: restaurant_service
      RESTAURANT_SERVICE_DB_PASSWORD: restaurant_service_password
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://discovery-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:-c3ByaW5nLWJvb3QtdXNlci1zZXJ2aWNlLWxvY2FsLWRldmVsb3BtZW50LXNlY3JldC0yMDI2}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8082/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  food-catalogue-service:
    build: services/food-catalogue-service
    container_name: food-catalogue-service
    depends_on:
      food-catalogue-service-mysql:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    environment:
      FOOD_CATALOGUE_SERVICE_DB_URL: jdbc:mysql://food-catalogue-service-mysql:3306/food_catalogue_service_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      FOOD_CATALOGUE_SERVICE_DB_USERNAME: food_catalogue_service
      FOOD_CATALOGUE_SERVICE_DB_PASSWORD: food_catalogue_service_password
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://discovery-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:-c3ByaW5nLWJvb3QtdXNlci1zZXJ2aWNlLWxvY2FsLWRldmVsb3BtZW50LXNlY3JldC0yMDI2}
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8083/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  order-service:
    build: services/order-service
    container_name: order-service
    depends_on:
      order-service-mongodb:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    environment:
      ORDER_SERVICE_MONGODB_URI: mongodb://order_service:order_service_password@order-service-mongodb:27017/order_service_db?authSource=admin
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://discovery-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:-c3ByaW5nLWJvb3QtdXNlci1zZXJ2aWNlLWxvY2FsLWRldmVsb3BtZW50LXNlY3JldC0yMDI2}
    ports:
      - "8084:8084"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8084/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  delivery-service:
    build: services/delivery-service
    container_name: delivery-service
    depends_on:
      delivery-service-mysql:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    environment:
      DELIVERY_SERVICE_DB_URL: jdbc:mysql://delivery-service-mysql:3306/delivery_service_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DELIVERY_SERVICE_DB_USERNAME: delivery_service
      DELIVERY_SERVICE_DB_PASSWORD: delivery_service_password
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://discovery-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:-c3ByaW5nLWJvb3QtdXNlci1zZXJ2aWNlLWxvY2FsLWRldmVsb3BtZW50LXNlY3JldC0yMDI2}
    ports:
      - "8085:8085"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8085/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  api-gateway:
    build: services/api-gateway
    container_name: api-gateway
    depends_on:
      discovery-server:
        condition: service_healthy
      user-service:
        condition: service_healthy
      restaurant-service:
        condition: service_healthy
      food-catalogue-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      delivery-service:
        condition: service_healthy
    environment:
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://discovery-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:-c3ByaW5nLWJvb3QtdXNlci1zZXJ2aWNlLWxvY2FsLWRldmVsb3BtZW50LXNlY3JldC0yMDI2}
    ports:
      - "8080:8080"

  # ---------- frontend ----------

  frontend:
    build: frontend/food-delivery-ui
    container_name: frontend
    depends_on:
      - api-gateway
    ports:
      - "4200:80"

  partner-app:
    build: frontend/partner-app
    container_name: partner-app
    depends_on:
      - api-gateway
    ports:
      - "4300:80"

  delivery-app:
    build: frontend/delivery-app
    container_name: delivery-app
    depends_on:
      - api-gateway
    ports:
      - "4400:80"

volumes:
  user_service_mysql_data:
  restaurant_service_mysql_data:
  food_catalogue_service_mysql_data:
  order_service_mongodb_data:
  delivery_service_mysql_data:
  kafka_data:
  redis_data:
