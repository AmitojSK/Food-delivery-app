spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration
      - org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration
  kafka:
    listener:
      auto-startup: false
    consumer:
      group-id: order-service-test
  cloud:
    discovery:
      enabled: false

eureka:
  client:
    enabled: false

security:
  jwt:
    secret: c3ByaW5nLWJvb3QtdXNlci1zZXJ2aWNlLXRlc3Qtc2VjcmV0LTIwMjY=

app:
  kafka:
    provision-topics: false
    topics:
      order-events: order.events.v1
      delivery-events: delivery.events.v1
