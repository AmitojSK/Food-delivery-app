server:
  port: 8084

spring:
  application:
    name: order-service
  data:
    mongodb:
      uri: mongodb://order_service:order_service_password@[::1]:27017/order_service_db?authSource=admin

management:
  endpoints:
    web:
      exposure:
        include: health,info

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
