server:
  port: ${PORT:8082}

spring:
  cache:
    type: redis
    redis:
      time-to-live: 5m
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: ${REDIS_TIMEOUT:500ms}
  application:
    name: restaurant-service
  datasource:
    url: ${RESTAURANT_SERVICE_DB_URL:jdbc:mysql://localhost:3308/restaurant_service_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${RESTAURANT_SERVICE_DB_USERNAME:restaurant_service}
    password: ${RESTAURANT_SERVICE_DB_PASSWORD:restaurant_service_password}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
      headers:
        Authorization: ${OTLP_AUTH_HEADER:}
    metrics:
      export:
        # Push metrics via OTLP (e.g. to Grafana Cloud) in prod; local uses Prometheus scrape.
        enabled: ${OTLP_METRICS_ENABLED:false}
        url: ${OTLP_METRICS_URL:http://localhost:4318/v1/metrics}
        step: 30s
        headers:
          Authorization: ${OTLP_AUTH_HEADER:}
  health:
    redis:
      enabled: false

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

security:
  jwt:
    secret: ${JWT_SECRET:c3ByaW5nLWJvb3QtdXNlci1zZXJ2aWNlLWxvY2FsLWRldmVsb3BtZW50LXNlY3JldC0yMDI2}
