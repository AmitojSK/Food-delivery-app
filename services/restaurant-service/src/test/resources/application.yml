spring:
  cloud:
    discovery:
      enabled: false
  datasource:
    url: jdbc:h2:mem:restaurant_service_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

eureka:
  client:
    enabled: false
