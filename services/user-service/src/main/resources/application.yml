server:
  port: ${PORT:8081}
  # Honour X-Forwarded-* from the gateway/nginx so the OAuth2 redirect/callback URLs
  # and request.isSecure() reflect the external origin, not the internal hop.
  forward-headers-strategy: framework

spring:
  application:
    name: user-service
  datasource:
    url: ${USER_SERVICE_DB_URL:jdbc:mysql://localhost:3307/user_service_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${USER_SERVICE_DB_USERNAME:user_service}
    password: ${USER_SERVICE_DB_PASSWORD:user_service_password}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
      headers:
        Authorization: ${OTLP_AUTH_HEADER:}
        api-key: ${OTLP_API_KEY:}
    metrics:
      export:
        # Push metrics via OTLP (e.g. to Grafana Cloud) in prod; local uses Prometheus scrape.
        enabled: ${OTLP_METRICS_ENABLED:false}
        url: ${OTLP_METRICS_URL:http://localhost:4318/v1/metrics}
        step: 30s
        aggregation-temporality: ${OTLP_METRICS_TEMPORALITY:cumulative}
        headers:
          Authorization: ${OTLP_AUTH_HEADER:}
          api-key: ${OTLP_API_KEY:}
    logging:
      endpoint: ${OTLP_LOGS_URL:http://localhost:4318/v1/logs}
      export:
        enabled: ${OTLP_LOGS_ENABLED:false}
      headers:
        Authorization: ${OTLP_AUTH_HEADER:}
        api-key: ${OTLP_API_KEY:}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

security:
  jwt:
    # Supply a distinct, Base64-encoded 256-bit secret outside local development.
    secret: ${JWT_SECRET:c3ByaW5nLWJvb3QtdXNlci1zZXJ2aWNlLWxvY2FsLWRldmVsb3BtZW50LXNlY3JldC0yMDI2}
    expiration: ${JWT_EXPIRATION:3600000}
  bootstrap-admin:
    enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}

# Extensible OAuth2 social sign-in. A provider is registered only when its client-id AND
# client-secret are both set, so the service starts fine with none configured (the buttons
# just don't appear). Add a provider by adding a block here + a case in OAuth2ProviderAdapter.
# redirect-uri must be the browser-facing callback that routes back to this service; behind
# the gateway that is the app origin + /user-api/login/oauth2/code/<provider>. Empty falls
# back to Spring's "{baseUrl}/login/oauth2/code/{registrationId}" template (local dev).
app:
  oauth2:
    success-redirect: ${OAUTH2_SUCCESS_REDIRECT:http://localhost:4200/oauth2/callback}
    # Both land on the SPA's /oauth2/callback route, which reads the success fragment or the
    # ?error query and then routes the user on (to the app, or back to /auth with the message).
    failure-redirect: ${OAUTH2_FAILURE_REDIRECT:http://localhost:4200/oauth2/callback}
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
      redirect-uri: ${OAUTH2_GOOGLE_REDIRECT_URI:}
    github:
      client-id: ${GITHUB_CLIENT_ID:}
      client-secret: ${GITHUB_CLIENT_SECRET:}
      redirect-uri: ${OAUTH2_GITHUB_REDIRECT_URI:}
