server:
  port: ${PORT:8080}

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: ${REDIS_TIMEOUT:500ms}
  cloud:
    gateway:
      routes:
        # Rate-limited routes are matched before their general counterparts below,
        # since Spring Cloud Gateway dispatches to the first predicate match.
        - id: user-service-auth
          uri: ${USER_SERVICE_URI:lb://USER-SERVICE}
          predicates:
            - Path=/user-api/api/v1/auth/**
          filters:
            - StripPrefix=1
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 5
                redis-rate-limiter.burstCapacity: 10
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@rateLimitKeyResolver}"
        - id: user-service
          uri: ${USER_SERVICE_URI:lb://USER-SERVICE}
          predicates:
            - Path=/user-api/**
          filters:
            - StripPrefix=1
        - id: restaurant-service
          uri: ${RESTAURANT_SERVICE_URI:lb://RESTAURANT-SERVICE}
          predicates:
            - Path=/restaurant-api/**
          filters:
            - StripPrefix=1
        - id: food-catalogue-service
          uri: ${FOOD_CATALOGUE_SERVICE_URI:lb://FOOD-CATALOGUE-SERVICE}
          predicates:
            - Path=/catalogue-api/**
          filters:
            - StripPrefix=1
        - id: order-service-checkout
          uri: ${ORDER_SERVICE_URI:lb://ORDER-SERVICE}
          predicates:
            - Path=/order-api/api/v1/orders
            - Method=POST
          filters:
            - StripPrefix=1
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 3
                redis-rate-limiter.burstCapacity: 6
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@rateLimitKeyResolver}"
        - id: order-service
          uri: ${ORDER_SERVICE_URI:lb://ORDER-SERVICE}
          predicates:
            - Path=/order-api/**
          filters:
            - StripPrefix=1
        - id: delivery-service-accept
          uri: ${DELIVERY_SERVICE_URI:lb://DELIVERY-SERVICE}
          predicates:
            - Path=/delivery-api/api/v1/deliveries/*/accept
            - Method=POST
          filters:
            - StripPrefix=1
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 3
                redis-rate-limiter.burstCapacity: 6
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@rateLimitKeyResolver}"
        - id: delivery-service
          uri: ${DELIVERY_SERVICE_URI:lb://DELIVERY-SERVICE}
          predicates:
            - Path=/delivery-api/**
          filters:
            - StripPrefix=1

management:
  endpoints:
    web:
      exposure:
        include: health,info

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

security:
  jwt:
    secret: ${JWT_SECRET:c3ByaW5nLWJvb3QtdXNlci1zZXJ2aWNlLWxvY2FsLWRldmVsb3BtZW50LXNlY3JldC0yMDI2}
