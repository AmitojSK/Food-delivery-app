server:
  port: ${PORT:8085}

spring:
  application:
    name: delivery-service
  cache:
    type: redis
    redis:
      time-to-live: 90s
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: ${REDIS_TIMEOUT:500ms}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    # Applies to producer, consumer and admin clients alike. Defaults keep local Docker
    # Compose on an unauthenticated broker; deployed environments set these to
    # SASL_PLAINTEXT/PLAIN plus a JAAS config, since the broker there is reachable
    # over the public internet and must not accept anonymous clients.
    properties:
      security.protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
      sasl.mechanism: ${KAFKA_SASL_MECHANISM:PLAIN}
      sasl.jaas.config: ${KAFKA_SASL_JAAS_CONFIG:}
    consumer:
      group-id: delivery-service-v1
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.value.default.type: java.util.LinkedHashMap
        spring.json.trusted.packages: java.util
    listener:
      ack-mode: record
      observation-enabled: true
    template:
      observation-enabled: true
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  datasource:
    url: ${DELIVERY_SERVICE_DB_URL:jdbc:mysql://localhost:3310/delivery_service_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DELIVERY_SERVICE_DB_USERNAME:delivery_service}
    password: ${DELIVERY_SERVICE_DB_PASSWORD:delivery_service_password}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
      headers:
        Authorization: ${OTLP_AUTH_HEADER:}
        api-key: ${OTLP_API_KEY:}
    metrics:
      export:
        # Push metrics via OTLP (e.g. to Grafana Cloud) in prod; local uses Prometheus scrape.
        enabled: ${OTLP_METRICS_ENABLED:false}
        url: ${OTLP_METRICS_URL:http://localhost:4318/v1/metrics}
        step: 30s
        aggregation-temporality: ${OTLP_METRICS_TEMPORALITY:cumulative}
        headers:
          Authorization: ${OTLP_AUTH_HEADER:}
          api-key: ${OTLP_API_KEY:}
    logging:
      endpoint: ${OTLP_LOGS_URL:http://localhost:4318/v1/logs}
      export:
        enabled: ${OTLP_LOGS_ENABLED:false}
      headers:
        Authorization: ${OTLP_AUTH_HEADER:}
        api-key: ${OTLP_API_KEY:}
  health:
    redis:
      enabled: false

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

security:
  jwt:
    secret: ${JWT_SECRET:c3ByaW5nLWJvb3QtdXNlci1zZXJ2aWNlLWxvY2FsLWRldmVsb3BtZW50LXNlY3JldC0yMDI2}

app:
  kafka:
    retry:
      max-attempts: 3
      backoff-ms: 1000
    topics:
      order-events: order.events.v1
      delivery-events: delivery.events.v1
