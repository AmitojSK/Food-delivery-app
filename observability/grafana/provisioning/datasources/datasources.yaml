apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true

  - name: Tempo
    type: tempo
    uid: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      # Jump from a trace's span to the logs for that service in Loki.
      tracesToLogsV2:
        datasourceUid: loki
        filterByTraceID: true
        tags: [{ key: 'service', value: 'service' }]

  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
