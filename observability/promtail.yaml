server:
  http_listen_port: 9080

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

# Discovers running containers via the Docker socket and ships their stdout to
# Loki, parsing the JSON log lines so `service`, `level`, and `traceId` become
# queryable — that's what lets you jump from a trace to its logs.
scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
    pipeline_stages:
      - json:
          expressions:
            service: service
            level: level
            traceId: traceId
      - labels:
          service:
          level:
