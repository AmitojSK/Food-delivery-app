version: 2
updates:
  # --- Backend services (Maven) ---
  - package-ecosystem: "maven"
    directory: "/services/discovery-server"
    schedule:
      interval: "weekly"
  - package-ecosystem: "maven"
    directory: "/services/api-gateway"
    schedule:
      interval: "weekly"
  - package-ecosystem: "maven"
    directory: "/services/user-service"
    schedule:
      interval: "weekly"
  - package-ecosystem: "maven"
    directory: "/services/restaurant-service"
    schedule:
      interval: "weekly"
  - package-ecosystem: "maven"
    directory: "/services/food-catalogue-service"
    schedule:
      interval: "weekly"
  - package-ecosystem: "maven"
    directory: "/services/order-service"
    schedule:
      interval: "weekly"
  - package-ecosystem: "maven"
    directory: "/services/delivery-service"
    schedule:
      interval: "weekly"

  # --- Frontend apps (npm) ---
  - package-ecosystem: "npm"
    directory: "/frontend/food-delivery-ui"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/frontend/partner-app"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/frontend/delivery-app"
    schedule:
      interval: "weekly"

  # --- Container base images ---
  - package-ecosystem: "docker"
    directory: "/services/discovery-server"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/services/api-gateway"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/services/user-service"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/services/restaurant-service"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/services/food-catalogue-service"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/services/order-service"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/services/delivery-service"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/frontend/food-delivery-ui"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/frontend/partner-app"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/frontend/delivery-app"
    schedule:
      interval: "weekly"

  # --- CI workflow actions ---
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
