name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

# A new push/PR update cancels this workflow's still-running run for the same
# ref instead of queuing alongside it — cuts job-slot usage when a branch gets
# pushed to repeatedly (exactly the scenario that saturated the queue here).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:

  backend:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - discovery-server
          - user-service
          - restaurant-service
          - food-catalogue-service
          - order-service
          - delivery-service
          - api-gateway
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - run: mvn verify -q
      - name: Generate SBOM (CycloneDX)
        run: mvn -q org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.service }}
          path: services/${{ matrix.service }}/target/bom.json
          retention-days: 30

  frontend:
    name: ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - food-delivery-ui
          - partner-app
          - delivery-app
    defaults:
      run:
        working-directory: frontend/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12'
          cache: npm
          cache-dependency-path: frontend/${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: npx ng test --watch=false
      - run: npx ng build --configuration production
      - name: Generate SBOM (CycloneDX)
        run: npx --yes @cyclonedx/cyclonedx-npm --output-file bom.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.app }}
          path: frontend/${{ matrix.app }}/bom.json
          retention-days: 30

  dependency-scan:
    name: dependency-scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan (Maven + npm manifests)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs-results.sarif
          severity: HIGH,CRITICAL
          exit-code: '0'
      - name: Upload results to the Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs-results.sarif

  docker:
    name: docker-build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    permissions:
      contents: read
      packages: write
    env:
      COMPOSE_PROJECT_NAME: fooddelivery
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
      - name: Scan built images for HIGH/CRITICAL vulnerabilities
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          images="fooddelivery-discovery-server fooddelivery-api-gateway fooddelivery-user-service fooddelivery-restaurant-service fooddelivery-food-catalogue-service fooddelivery-order-service fooddelivery-delivery-service fooddelivery-frontend fooddelivery-partner-app fooddelivery-delivery-app"
          for image in $images; do
            echo "::group::Trivy scan: $image"
            trivy image --severity HIGH,CRITICAL --exit-code 0 "$image"
            echo "::endgroup::"
          done
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag and push immutable images to GHCR
        if: github.event_name == 'push'
        run: |
          owner=$(printf '%s' "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          branch=$(printf '%s' "${{ github.ref_name }}" | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9._-' '-')
          images="fooddelivery-discovery-server fooddelivery-api-gateway fooddelivery-user-service fooddelivery-restaurant-service fooddelivery-food-catalogue-service fooddelivery-order-service fooddelivery-delivery-service fooddelivery-frontend fooddelivery-partner-app fooddelivery-delivery-app"

          # GHCR occasionally returns a transient "unknown blob" error mid-upload
          # (seen pushing food-delivery-app-frontend); retry a few times before
          # failing the job outright.
          push_with_retry() {
            for attempt in 1 2 3; do
              if docker push "$1"; then
                return 0
              fi
              echo "Push of $1 failed (attempt $attempt/3); retrying in 10s..."
              sleep 10
            done
            echo "Push of $1 failed after 3 attempts."
            return 1
          }

          for image in $images; do
            name=${image#fooddelivery-}
            target="ghcr.io/$owner/food-delivery-app-$name"
            docker tag "$image" "$target:${{ github.sha }}"
            docker tag "$image" "$target:$branch"
            push_with_retry "$target:${{ github.sha }}"
            push_with_retry "$target:$branch"
          done
