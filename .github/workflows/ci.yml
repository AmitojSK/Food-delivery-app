name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

# A new push/PR update cancels this workflow's still-running run for the same
# ref instead of queuing alongside it — cuts job-slot usage when a branch gets
# pushed to repeatedly (exactly the scenario that saturated the queue here).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:

  backend:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - discovery-server
          - user-service
          - restaurant-service
          - food-catalogue-service
          - order-service
          - delivery-service
          - realtime-service
          - api-gateway
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      # Maven Central intermittently returns HTTP 5xx (seen: 502 resolving
      # org.apache.kafka:kafka-server-common, a transitive dep of spring-kafka),
      # which fails the job AND caches the failed resolution as a *.lastUpdated
      # marker. With `cache: maven` that marker can survive into later runs, so
      # a single flaky 502 keeps failing until "updates are forced". -U forces
      # re-resolution past the cached failure; the retry loop rides out the 5xx.
      - name: Build & verify (resilient to transient Central 5xx)
        run: |
          for attempt in 1 2 3; do
            mvn verify -q -U -Dmaven.wagon.http.retryHandler.count=3 && exit 0
            echo "mvn verify failed (attempt $attempt/3); retrying in 15s..."
            sleep 15
          done
          exit 1
      - name: Generate SBOM (CycloneDX)
        run: mvn -q org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.service }}
          path: services/${{ matrix.service }}/target/bom.json
          retention-days: 30

  frontend:
    name: ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - food-delivery-ui
          - partner-app
          - delivery-app
    defaults:
      run:
        working-directory: frontend/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12'
          cache: npm
          cache-dependency-path: frontend/${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: npx ng test --watch=false
      - run: npx ng build --configuration production
      - name: Generate SBOM (CycloneDX)
        run: npx --yes @cyclonedx/cyclonedx-npm --output-file bom.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.app }}
          path: frontend/${{ matrix.app }}/bom.json
          retention-days: 30

  dependency-scan:
    name: dependency-scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan (Maven + npm manifests)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs-results.sarif
          severity: HIGH,CRITICAL
          exit-code: '0'
      - name: Upload results to the Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs-results.sarif

  docker:
    name: docker-build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    permissions:
      contents: read
      packages: write
    env:
      COMPOSE_PROJECT_NAME: fooddelivery
    steps:
      - uses: actions/checkout@v4
      # docker-compose interpolates the whole file before it builds anything, and JWT_SECRET is
      # required with no default (fail-fast, so a real deploy can't ship without it). The value is
      # irrelevant for `build` — images don't bake env in — so seed the committed example .env just
      # to satisfy interpolation.
      - name: Seed build-time env for compose interpolation
        run: cp .env.example .env
      - run: docker compose build
      - name: Scan built images for HIGH/CRITICAL vulnerabilities
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          images="fooddelivery-discovery-server fooddelivery-api-gateway fooddelivery-user-service fooddelivery-restaurant-service fooddelivery-food-catalogue-service fooddelivery-order-service fooddelivery-delivery-service fooddelivery-realtime-service fooddelivery-frontend fooddelivery-partner-app fooddelivery-delivery-app"
          for image in $images; do
            echo "::group::Trivy scan: $image"
            trivy image --severity HIGH,CRITICAL --exit-code 0 "$image"
            echo "::endgroup::"
          done
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag and push immutable images to GHCR
        if: github.event_name == 'push'
        run: |
          owner=$(printf '%s' "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          branch=$(printf '%s' "${{ github.ref_name }}" | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9._-' '-')
          images="fooddelivery-discovery-server fooddelivery-api-gateway fooddelivery-user-service fooddelivery-restaurant-service fooddelivery-food-catalogue-service fooddelivery-order-service fooddelivery-delivery-service fooddelivery-realtime-service fooddelivery-frontend fooddelivery-partner-app fooddelivery-delivery-app"

          # GHCR occasionally returns a transient "unknown blob" error mid-upload
          # (seen pushing food-delivery-app-frontend); retry a few times before
          # failing the job outright.
          push_with_retry() {
            for attempt in 1 2 3; do
              if docker push "$1"; then
                return 0
              fi
              echo "Push of $1 failed (attempt $attempt/3); retrying in 10s..."
              sleep 10
            done
            echo "Push of $1 failed after 3 attempts."
            return 1
          }

          for image in $images; do
            name=${image#fooddelivery-}
            target="ghcr.io/$owner/food-delivery-app-$name"
            docker tag "$image" "$target:${{ github.sha }}"
            docker tag "$image" "$target:$branch"
            push_with_retry "$target:${{ github.sha }}"
            push_with_retry "$target:$branch"
          done

  # --- Image-based deploy to Render (DORMANT until opted in) ---------------------
  # This job implements "build once, deploy the same image": instead of Render
  # rebuilding each service from source, Render pulls the exact image this run
  # built + Trivy-scanned + pushed above, pinned to the commit SHA.
  #
  # It is SAFE to merge while services are still build-from-source: it only runs
  # when the repo variable RENDER_IMAGE_DEPLOYS == 'true' (unset by default →
  # skipped). `needs: [docker]` means it can only fire when build+scan+push all
  # succeeded, and the implicit success() on its `if:` means any earlier failure
  # skips it — a red pipeline never triggers a deploy.
  #
  # To ACTIVATE (all on the user's side, see interview notes 21-cicd.md):
  #   1. Reconfigure the 11 Render services to source = "Existing Image"
  #      (ghcr.io/<owner>/food-delivery-app-<name>), ideally via a render.yaml
  #      Blueprint. Public packages need no pull credential.
  #   2. Add each service's Render deploy-hook URL as a repo secret named
  #      RENDER_HOOK_<SERVICE> (see the env map below).
  #   3. Set repo variable RENDER_IMAGE_DEPLOYS = true.
  deploy:
    name: deploy-to-render
    needs: [docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop' && vars.RENDER_IMAGE_DEPLOYS == 'true'
    runs-on: ubuntu-latest
    env:
      HOOK_discovery_server:      ${{ secrets.RENDER_HOOK_DISCOVERY_SERVER }}
      HOOK_api_gateway:           ${{ secrets.RENDER_HOOK_API_GATEWAY }}
      HOOK_user_service:          ${{ secrets.RENDER_HOOK_USER_SERVICE }}
      HOOK_restaurant_service:    ${{ secrets.RENDER_HOOK_RESTAURANT_SERVICE }}
      HOOK_food_catalogue_service: ${{ secrets.RENDER_HOOK_FOOD_CATALOGUE_SERVICE }}
      HOOK_order_service:         ${{ secrets.RENDER_HOOK_ORDER_SERVICE }}
      HOOK_delivery_service:      ${{ secrets.RENDER_HOOK_DELIVERY_SERVICE }}
      HOOK_realtime_service:      ${{ secrets.RENDER_HOOK_REALTIME_SERVICE }}
      HOOK_frontend:              ${{ secrets.RENDER_HOOK_FRONTEND }}
      HOOK_partner_app:           ${{ secrets.RENDER_HOOK_PARTNER_APP }}
      HOOK_delivery_app:          ${{ secrets.RENDER_HOOK_DELIVERY_APP }}
    steps:
      - name: Trigger Render redeploys of the just-pushed images
        run: |
          owner=$(printf '%s' "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          failed=0

          # Render's deploy-hook URL already carries ?key=..., so the image to
          # deploy is appended as &imgURL=... Each attempt is retried; a service
          # that still fails is recorded so we can fail the job loudly at the end
          # (the others have already been triggered — partial deploy is visible,
          # not silent). We attempt ALL services before failing so one transient
          # blip doesn't block the other ten.
          deploy_with_retry() {
            local name="$1" hook="$2" img="$3"
            if [ -z "$hook" ]; then
              echo "::error::No deploy-hook secret set for $name (RENDER_HOOK_... missing)"
              return 1
            fi
            for attempt in 1 2 3; do
              if curl -fsS "${hook}&imgURL=${img}" >/dev/null; then
                echo "Triggered deploy: $name -> $img"
                return 0
              fi
              echo "Deploy trigger for $name failed (attempt $attempt/3); retrying in 10s..."
              sleep 10
            done
            echo "::error::Deploy trigger for $name failed after 3 attempts"
            return 1
          }

          for name in discovery-server api-gateway user-service restaurant-service \
                      food-catalogue-service order-service delivery-service realtime-service \
                      frontend partner-app delivery-app; do
            hookvar="HOOK_${name//-/_}"
            # Deploy the exact SHA-tagged image this run pushed (immutable per commit).
            # For maximum strictness, swap the tag for the @sha256 digest captured at push time.
            img="ghcr.io/$owner/food-delivery-app-$name:${{ github.sha }}"
            deploy_with_retry "$name" "${!hookvar}" "$img" || failed=1
          done

          if [ "$failed" -ne 0 ]; then
            echo "::error::One or more Render deploys failed — those services may be on a stale image (version skew). Re-run this job or roll back by redeploying the previous digest."
            exit 1
          fi
